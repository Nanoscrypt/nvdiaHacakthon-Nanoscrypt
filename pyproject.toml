[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nanoscrypt"
version = "1.1.1"
description = "A standalone agentic framework that dynamically synthesizes, validates, executes, versions, and reuses tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Nanoscrypt Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "litellm>=1.40.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.5.0",
    "structlog>=24.0.0",
    "python-multipart>=0.0.9",
    "headroom-ai>=0.32.0",
    "memmachine-client>=0.3.9",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "keyring>=25.0.0",
    "tomli>=2.0.0; python_version<'3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
]
nebius = [
    "contree-sdk==0.3.6; python_version >= '3.12'",
]

[project.scripts]
nanoscrypt = "nanoscrypt.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nanoscrypt"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
